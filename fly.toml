app = 'nebulosa-async-api'
primary_region = 'gru'

[build]

[env]
  PORT = '8080'
  DATABASE_URL = '/data/nebulosa.db'

[mounts]
  source = 'nebulosa_async_api_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256'
